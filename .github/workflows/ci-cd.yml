name: CI/CD

# Aligne la CI sur le vrai flux de build du mod : CMake (cmake -B build -A Win32),
# le meme que deploy_relicrush.ps1. Les anciens jobs compilaient linux/Makefile et
# projects/vs2019/projects.sln, qui ne referencent AUCUNE source relicrush_*.cpp :
# ils ne compilaient donc jamais le code du mod et ne pouvaient catcher aucune regression.

on: [push, pull_request]

jobs:
  windows:
    name: Windows (CMake Win32)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Le mod est server-only ; install/relicrush sert juste a satisfaire la contrainte
      # "CMAKE_INSTALL_PREFIX doit pointer vers un dossier de mod" (pas de cmake --install ici).
      - name: Configure (CMake, Win32)
        run: cmake -B build -A Win32 -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/install/relicrush"

      - name: Build (Release) — hl + client + tests
        run: cmake --build build --config Release

      - name: Unit tests (ctest)
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Upload mod libraries
        uses: actions/upload-artifact@v4
        with:
          name: relicrush-win32
          path: |
            build/dlls/Release/hl.dll
            build/dlls/Release/hl.pdb
            build/cl_dll/Release/client.dll
            build/cl_dll/Release/client.pdb

  linux-tests:
    name: Linux (clamp unit tests)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # relicrush_clamp_tests est volontairement sans dependance au moteur Half-Life :
      # il compile et tourne en natif (pas de toolchain 32-bit, pas d'OpenGL requis),
      # ce qui donne une couverture cross-platform fiable de la validation des cvars.
      - name: Configure (CMake, native)
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/install/relicrush"

      - name: Build tests
        run: cmake --build build --target relicrush_clamp_tests

      - name: Unit tests (ctest)
        run: ctest --test-dir build --output-on-failure
